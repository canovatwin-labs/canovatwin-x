version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /web
    # openapi-typescript 7.13.0 supports TypeScript ^5.x only.
    # Revisit major upgrades together with the generator compatibility task.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Version 7 pulls an unpatched resolver; see docs/DEPENDENCY_REVIEW.md.
      - dependency-name: openapi-typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
