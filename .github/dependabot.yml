version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /web
    groups:
      frontend-bundler:
        patterns:
          - vite
          - '@vitejs/plugin-react'
    # Keep the schema generator/compiler transition under explicit review.
    # Revisit major upgrades together with the generator compatibility task.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Version 7 pulls an unpatched resolver; see docs/DEPENDENCY_REVIEW.md.
      - dependency-name: openapi-typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
