[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canovatwin-x"
version = "0.11.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Offline evidence-based data-center environmental digital twin"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "httpx2>=2.16,<3"]

[project.scripts]
canovatwin = "canovatwin.cli:main"
canovatwin-api = "canovatwin.api.server:main"
canovatwin-evaluate = "canovatwin.evaluation.cli:main"
canovatwin-dataset = "canovatwin.dataset_intake.cli:main"

[tool.setuptools.package-data]
canovatwin = ["web/index.html", "web/assets/*.js", "web/assets/*.css", "web/assets/*.svg", "web/assets/*.png", "web/assets/*.webp", "web/assets/*.ico", "web/assets/*.woff", "web/assets/*.woff2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["canovatwin"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
